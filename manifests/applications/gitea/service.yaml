# Gitea runs as a Docker container (~/gitrp/cicd), not in k3s. This selector-less
# Service plus the EndpointSlice below point Traefik at the container's published
# host port (192.168.3.43:3333).
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: applications
spec:
  ports:
    - name: http
      port: 80
      targetPort: 3333
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: gitea-1
  namespace: applications
  labels:
    kubernetes.io/service-name: gitea
addressType: IPv4
ports:
  - name: http
    port: 3333
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.3.43
