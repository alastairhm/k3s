apiVersion: v1
kind: ConfigMap
metadata:
  name: homer-config
  namespace: applications
data:
  config.yml: |
    ---
    title: "Homelab"
    subtitle: "optiplex3050 · k3s"
    theme: default
    header: true
    footer: false
    columns: "3"

    links:
      - name: "k3s repo"
        icon: "fab fa-github"
        url: "https://github.com/alastairhm/k3s"
        target: "_blank"

    services:
      - name: "Infrastructure"
        icon: "fas fa-server"
        items:
          - name: "Portainer"
            subtitle: "Container & cluster management"
            icon: "fas fa-ship"
            url: "https://dell3050.duckdns.org:9443"
            target: "_blank"

          - name: "Pi-hole"
            subtitle: "DNS & ad blocking"
            icon: "fas fa-shield-alt"
            url: "http://192.168.3.55/admin/"
            target: "_blank"

      - name: "Monitoring"
        icon: "fas fa-chart-line"
        items:
          - name: "Beszel"
            subtitle: "Server monitoring"
            icon: "fas fa-heartbeat"
            url: "http://dell3050.duckdns.org:8090"
            target: "_blank"

          - name: "Chronograf"
            subtitle: "InfluxDB dashboards"
            icon: "fas fa-chart-area"
            url: "http://192.168.3.55:8888/sources/0/dashboards/1?refresh=Paused&lower=now%28%29%20-%207d"
            target: "_blank"

      - name: "Dev"
        icon: "fas fa-code-branch"
        items:
          - name: "Gitea"
            subtitle: "Git hosting"
            icon: "fas fa-code-branch"
            url: "http://dell3050.duckdns.org:3333"
            target: "_blank"

          - name: "Woodpecker"
            subtitle: "CI/CD"
            icon: "fas fa-dove"
            url: "http://dell3050.duckdns.org:8888"
            target: "_blank"

      - name: "Media"
        icon: "fas fa-photo-video"
        items:
          - name: "Jellyfin"
            subtitle: "Media server"
            icon: "fas fa-film"
            url: "http://dell3050.duckdns.org:8096/"
            target: "_blank"

          - name: "Jellyfin (Tailscale)"
            subtitle: "Media server via Tailscale"
            icon: "fas fa-film"
            url: "http://optiplex3050.taile1582c.ts.net:8096/"
            target: "_blank"

          - name: "Calibre Web"
            subtitle: "E-book library"
            icon: "fas fa-book"
            url: "http://dell3050.duckdns.org:32771"
            target: "_blank"

      - name: "Downloads"
        icon: "fas fa-download"
        items:
          - name: "Transmission"
            subtitle: "Torrent client"
            icon: "fas fa-magnet"
            url: "http://dell3050.duckdns.org:9091/transmission/web/"
            target: "_blank"

      - name: "Automation"
        icon: "fas fa-robot"
        items:
          - name: "Home Assistant"
            subtitle: "Home automation"
            icon: "fas fa-house-signal"
            url: "https://gsacqw42voxqxak5fmwjqbmyd0g12rzf.ui.nabu.casa/lovelace/0"
            target: "_blank"

          - name: "n8n"
            subtitle: "Workflow automation"
            icon: "fas fa-project-diagram"
            url: "http://dell3050.duckdns.org:5678/home/workflows"
            target: "_blank"

      - name: "Experiments"
        icon: "fas fa-flask"
        items:
          - name: "whoami"
            subtitle: "Test app"
            icon: "fas fa-vial"
            url: "http://dell3050.duckdns.org/whoami/"
            target: "_blank"

      # Add more groups/items here as you deploy new services, e.g.:
      # - name: "Applications"
      #   icon: "fas fa-cubes"
      #   items:
      #     - name: "My App"
      #       subtitle: "What it does"
      #       icon: "fas fa-cube"
      #       url: "http://my-app.local"
      #       target: "_blank"
