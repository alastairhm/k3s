# Reachable at http://dell3050.duckdns.org/homer/ (DuckDNS hostname for this
# host). Multiple apps share the one DuckDNS hostname via path-based routing;
# see whoami/ingress.yaml for the sibling example on /whoami.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homer
  namespace: applications
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: applications-homer-stripprefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: dell3050.duckdns.org
      http:
        paths:
          - path: /homer
            pathType: Prefix
            backend:
              service:
                name: homer
                port:
                  number: 80
