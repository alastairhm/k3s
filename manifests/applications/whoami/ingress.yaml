# Reachable at http://dell3050.duckdns.org/whoami/ (DuckDNS hostname for this
# host). Multiple apps share the one DuckDNS hostname via path-based routing;
# see homer/ingress.yaml for the sibling example on /homer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: applications
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: applications-whoami-stripprefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: dell3050.duckdns.org
      http:
        paths:
          - path: /whoami
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80
