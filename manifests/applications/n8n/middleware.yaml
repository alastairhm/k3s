# Strips the /n8n path prefix before forwarding to n8n. n8n still builds its
# links under /n8n because N8N_PATH is set in its docker-compose.yml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: n8n-stripprefix
  namespace: applications
spec:
  stripPrefix:
    prefixes:
      - /n8n
