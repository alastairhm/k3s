# n8n runs as a Docker container (~/gitrp/n8n), not in k3s. This selector-less
# Service plus the EndpointSlice below point Traefik at the container's published
# host port (192.168.3.43:5678).
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: applications
spec:
  ports:
    - name: http
      port: 80
      targetPort: 5678
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: n8n-1
  namespace: applications
  labels:
    kubernetes.io/service-name: n8n
addressType: IPv4
ports:
  - name: http
    port: 5678
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.3.43
